<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` plus the safe-area insets in the stylesheet keep the board clear
         of notches and gesture bars on a phone. `user-scalable=no` because a chessboard that
         pinch-zooms while you are dragging a piece is a bug, not a feature. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#140c06" />
    <meta name="description" content="Chess where every piece can be enchanted, and nothing is hidden." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Enchanted Chess</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
